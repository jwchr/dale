name: branch cleanup
# Owner request 2026-11-11: delete work branches once their pull request is merged.
# scripts/branch-cleanup.mjs deletes a branch only if its PR was merged, nothing was pushed after
# the merge, no open PR uses it, and it is not main. Manual runs are dry runs unless "delete" is ticked.
# Public repository: standard GitHub-hosted runners cost nothing here; each run takes seconds.
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      delete:
        description: Actually delete (unticked lists what would be deleted)
        type: boolean
        default: false
permissions:
  contents: read
# No concurrency group: GitHub would cancel a waiting run when another arrives, leaving that branch
# behind. Overlapping runs are safe because each deletion is conditional on the checked commit.
jobs:
  cleanup:
    if: >-
      github.repository == 'jwchr/dale' && (
        (github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
         github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      pull-requests: read
    steps:
      # The script runs from main, never from the pull request's own branch, and nothing else is
      # installed or run. The checkout keeps its job token so `git push --force-with-lease` can delete.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/branch-cleanup.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPLY: ${{ github.event_name == 'pull_request' || inputs.delete == true }}
          ONLY_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || '' }}
