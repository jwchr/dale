name: Archive private NJ Transit timetables
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dale-static-gtfs-archive
  cancel-in-progress: false
jobs:
  archive:
    if: github.ref == 'refs/heads/main' && github.repository == 'jwchr/dale'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Save distinct bus and rail timetable originals privately
        run: node scripts/archive-static-gtfs.mjs
        env:
          WRANGLER_SEND_METRICS: 'false'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NJT_API_USERNAME: ${{ secrets.NJT_API_USERNAME }}
          NJT_API_PASSWORD: ${{ secrets.NJT_API_PASSWORD }}
