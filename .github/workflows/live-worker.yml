name: Deploy live bus pilot
# Owner-initiated only, after exact-head CI and independent review/merge. No PR secrets or auto deployment.
on:
  workflow_dispatch:
    inputs:
      history_collection:
        description: 'Private bus history: enable only after independent review and current Free-plan capacity verification; disabled stops an existing collector; inspect compares original stop versions; restore-disabled redeploys reviewed code without collecting'
        type: choice
        required: true
        default: disabled
        options: [disabled, enabled, inspect, restore-disabled, cadence-test, cadence-cleanup, preserve-enabled, rollback-enabled]
      canonical_context_key:
        description: 'preserve-enabled/rollback-enabled: operator-verified current feedVersion:SHA256 canonical context; must remain identical'
        type: string
        required: false
      expected_worker_version:
        description: 'preserve-enabled/rollback-enabled: operator-verified CURRENT active Worker UUID (not the rollback target)'
        type: string
        required: false
      rollback_reference:
        description: 'rollback-enabled only: prior verified enabled reference JSON (non-secret version/content/runtime/binding/context hashes)'
        type: string
        required: false
      rollback_reference_sha256:
        description: 'rollback-enabled only: the reference digest printed with that prior independently qualified reference'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: dale-live-worker-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.repository == 'jwchr/dale'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Remove only an expired cadence binding and verify preservation
        if: inputs.history_collection == 'cadence-cleanup'
        run: node scripts/test-history-cadence.mjs --cleanup-expired
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DALE_WORKER_URL: ${{ vars.DALE_WORKER_URL }}
      - name: Run the owner-authorized one-shot three-minute cadence test
        if: inputs.history_collection == 'cadence-test'
        run: node scripts/test-history-cadence.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DALE_WORKER_URL: ${{ vars.DALE_WORKER_URL }}
      - name: Inspect original adjacent stop versions without changing settings
        if: inputs.history_collection == 'inspect'
        run: node scripts/stop-history-collection.mjs --inspect
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DALE_WORKER_URL: ${{ vars.DALE_WORKER_URL }}
      - name: Stop history through Cloudflare only and verify preserved evidence
        if: inputs.history_collection == 'disabled'
        run: node scripts/stop-history-collection.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DALE_WORKER_URL: ${{ vars.DALE_WORKER_URL }}
      - name: Require the configured deployment secrets before contacting NJ Transit
        if: inputs.history_collection == 'enabled' || inputs.history_collection == 'restore-disabled' || inputs.history_collection == 'preserve-enabled'
        run: node -e 'const keys=["NJT_API_USERNAME","NJT_API_PASSWORD","CLOUDFLARE_API_TOKEN","CLOUDFLARE_ACCOUNT_ID","DALE_WORKER_URL"];if(keys.some(k=>!process.env[k]?.trim())){console.error("Deployment configuration is incomplete. No NJ Transit request sent.");process.exit(1)}'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NJT_API_USERNAME: ${{ secrets.NJT_API_USERNAME }}
          NJT_API_PASSWORD: ${{ secrets.NJT_API_PASSWORD }}
          DALE_WORKER_URL: ${{ vars.DALE_WORKER_URL }}
      - run: npm ci
        if: inputs.history_collection == 'enabled' || inputs.history_collection == 'restore-disabled' || inputs.history_collection == 'preserve-enabled' || inputs.history_collection == 'rollback-enabled'
      - name: Prepare official G2 schedule; preserve exact current context when requested (no raw artifacts)
        if: inputs.history_collection == 'enabled' || inputs.history_collection == 'restore-disabled' || inputs.history_collection == 'preserve-enabled'
        run: npm run worker:prepare
        env:
          HISTORY_COLLECTION_MODE: ${{ inputs.history_collection }}
          HISTORY_CANONICAL_CONTEXT: ${{ inputs.canonical_context_key }}
          HISTORY_EXPECTED_WORKER_VERSION: ${{ inputs.expected_worker_version }}
          DALE_WORKER_URL: ${{ vars.DALE_WORKER_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NJT_API_USERNAME: ${{ secrets.NJT_API_USERNAME }}
          NJT_API_PASSWORD: ${{ secrets.NJT_API_PASSWORD }}
      - name: Deploy the reviewed private relay and verify an actual matched bus
        if: inputs.history_collection == 'enabled' || inputs.history_collection == 'restore-disabled' || inputs.history_collection == 'preserve-enabled'
        run: node scripts/deploy-live-worker.mjs
        env:
          WRANGLER_SEND_METRICS: 'false'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NJT_API_USERNAME: ${{ secrets.NJT_API_USERNAME }}
          NJT_API_PASSWORD: ${{ secrets.NJT_API_PASSWORD }}
          DALE_WORKER_URL: ${{ vars.DALE_WORKER_URL }}
          HISTORY_COLLECTION_MODE: ${{ inputs.history_collection }}
          HISTORY_CANONICAL_CONTEXT: ${{ inputs.canonical_context_key }}
          HISTORY_EXPECTED_WORKER_VERSION: ${{ inputs.expected_worker_version }}
      - name: Explicit pinned enabled rollback; no preparation, secret-force or resource mutation
        if: inputs.history_collection == 'rollback-enabled'
        run: node scripts/deploy-live-worker.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DALE_WORKER_URL: ${{ vars.DALE_WORKER_URL }}
          HISTORY_COLLECTION_MODE: ${{ inputs.history_collection }}
          HISTORY_CANONICAL_CONTEXT: ${{ inputs.canonical_context_key }}
          HISTORY_EXPECTED_WORKER_VERSION: ${{ inputs.expected_worker_version }}
          HISTORY_ROLLBACK_REFERENCE: ${{ inputs.rollback_reference }}
          HISTORY_ROLLBACK_REFERENCE_SHA256: ${{ inputs.rollback_reference_sha256 }}
