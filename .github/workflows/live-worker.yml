name: Deploy live bus pilot
# Owner-initiated only, after exact-head CI and independent review/merge. No PR secrets or auto deployment.
on:
  workflow_dispatch:
    inputs:
      history_collection:
        description: 'Private bus history: enable only after independent review and current Free-plan capacity verification; disabled stops an existing collector; inspect compares original stop versions; restore-disabled redeploys reviewed code without collecting'
        type: choice
        required: true
        default: disabled
        options: [disabled, enabled, inspect, restore-disabled, cadence-test]
permissions:
  contents: read
concurrency:
  group: dale-live-worker-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.repository == 'jwchr/dale'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Run the owner-authorized one-shot three-minute cadence test
        if: inputs.history_collection == 'cadence-test'
        run: node scripts/test-history-cadence.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DALE_WORKER_URL: ${{ vars.DALE_WORKER_URL }}
      - name: Inspect original adjacent stop versions without changing settings
        if: inputs.history_collection == 'inspect'
        run: node scripts/stop-history-collection.mjs --inspect
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DALE_WORKER_URL: ${{ vars.DALE_WORKER_URL }}
      - name: Stop history through Cloudflare only and verify preserved evidence
        if: inputs.history_collection == 'disabled'
        run: node scripts/stop-history-collection.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DALE_WORKER_URL: ${{ vars.DALE_WORKER_URL }}
      - name: Require the configured deployment secrets before contacting NJ Transit
        if: inputs.history_collection == 'enabled' || inputs.history_collection == 'restore-disabled'
        run: node -e 'const keys=["NJT_API_USERNAME","NJT_API_PASSWORD","CLOUDFLARE_API_TOKEN","CLOUDFLARE_ACCOUNT_ID","DALE_WORKER_URL"];if(keys.some(k=>!process.env[k]?.trim())){console.error("Deployment configuration is incomplete. No NJ Transit request sent.");process.exit(1)}'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NJT_API_USERNAME: ${{ secrets.NJT_API_USERNAME }}
          NJT_API_PASSWORD: ${{ secrets.NJT_API_PASSWORD }}
          DALE_WORKER_URL: ${{ vars.DALE_WORKER_URL }}
      - run: npm ci
        if: inputs.history_collection == 'enabled' || inputs.history_collection == 'restore-disabled'
      - name: Prepare canonical official G2 static schedule (no raw artifacts)
        if: inputs.history_collection == 'enabled' || inputs.history_collection == 'restore-disabled'
        run: npm run worker:prepare
        env:
          NJT_API_USERNAME: ${{ secrets.NJT_API_USERNAME }}
          NJT_API_PASSWORD: ${{ secrets.NJT_API_PASSWORD }}
      - name: Deploy the reviewed private relay and verify an actual matched bus
        if: inputs.history_collection == 'enabled' || inputs.history_collection == 'restore-disabled'
        run: node scripts/deploy-live-worker.mjs
        env:
          WRANGLER_SEND_METRICS: 'false'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NJT_API_USERNAME: ${{ secrets.NJT_API_USERNAME }}
          NJT_API_PASSWORD: ${{ secrets.NJT_API_PASSWORD }}
          DALE_WORKER_URL: ${{ vars.DALE_WORKER_URL }}
          HISTORY_COLLECTION_MODE: ${{ inputs.history_collection }}
