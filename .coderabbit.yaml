# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Every Dale PR gets a full CodeRabbit review and Neon, and merges only after both.
# High-risk PRs also follow REVIEW_POLICY.md. Rule home: ~/.claude/CLAUDE.md, Reviews.
# No automatic duplicate reviews on opening/pushing a high-risk PR.
reviews:
  auto_review:
    enabled: false
    auto_incremental_review: false
    description_keyword: ""
    labels: []
  auto_approvals:
    enabled: false
    allow_author_approval: false
  high_level_summary: false
  review_info: true
  review_details: true
